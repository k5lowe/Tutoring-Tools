# Render blueprint: https://render.com/docs/blueprint-spec
#
# Deploy by pointing Render at this repository — it reads this file and creates
# the service and its disk. The disk is the important part: the bank is a
# SQLite file, and a platform with an ephemeral filesystem would silently wipe
# every question on each deploy.

services:
  - type: web
    name: tutoring-tools
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # the free plan has no persistent disk
    region: oregon
    healthCheckPath: /api/health

    disk:
      name: tutoring-tools-data
      mountPath: /data
      # ~10,000 questions is about 3 MB. Snapshots land in /data/snapshots and
      # are pruned to roughly thirty copies, so budget about 100 MB for those.
      sizeGB: 1

    envVars:
      - key: MULTI_USER
        value: "1"
      - key: TUTORING_TOOLS_DB
        value: /data/tutoring-tools.db
      # The key that unlocks editing the problem bank. Set it in the Render
      # dashboard rather than here: sync:false means "prompt me, do not commit".
      - key: ADMIN_KEY
        sync: false
      # Render provides PORT; the app already honours it.
